name: aec_community_ui
description: AEC Community App - Full version with security and features
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and animations
  flutter_animate: ^4.1.0
  
  # Secure storage
  flutter_secure_storage: ^9.0.0
  
  # Local notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  
  # Email sending
  mailer: ^6.0.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  
  # Encryption
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  
  # Device info
  device_info_plus: ^9.1.0
  
  # Sharing
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
