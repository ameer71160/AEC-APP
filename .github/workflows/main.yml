name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # تتيح لك التشغيل يدوياً من تبويب Actions

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'   # يمكنك تغييرها لأحدث إصدار مستقر
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Verify project structure
        run: |
          flutter clean
          flutter pub get

      - name: 🏗️ Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: build/app/outputs/flutter-apk/*.apk

      - name: 📤 Upload app bundle (optional)
        uses: actions/upload-artifact@v4
        with:
          name: aec-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
        if: always()
