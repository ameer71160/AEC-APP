name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🏗️ Create fresh Flutter project
        run: |
          mkdir fresh_app
          cd fresh_app
          flutter create --org com.aec --project-name aec_community .
          cd ..

      - name: 🔄 Replace with your custom code and assets
        run: |
          rm -rf fresh_app/lib
          rm -rf fresh_app/assets
          cp -r lib fresh_app/
          cp -r assets fresh_app/ 2>/dev/null || true
          cp pubspec.yaml fresh_app/ 2>/dev/null || true

      - name: 📦 Install dependencies
        run: |
          cd fresh_app
          flutter pub get

      - name: 🔧 Fix Kotlin version conflict
        run: |
          cd fresh_app/android
          # استبدال إصدار Kotlin في build.gradle
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' build.gradle
          # أو استخدام الأمر التالي للتأكد
          echo "✅ Kotlin version updated to 1.9.0"

      - name: 🛠️ Fix Gradle wrapper permissions
        run: |
          cd fresh_app/android
          chmod +x gradlew

      - name: 🏗️ Build APK (release)
        run: |
          cd fresh_app
          flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: fresh_app/build/app/outputs/flutter-apk/*.apk
