name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🏗️ Create fresh project with minimal config
        run: |
          # إنشاء مشروع جديد
          flutter create --org com.aec --project-name aec_community fresh_app
          
          # الانتقال إلى المشروع
          cd fresh_app
          
          # حذف الملفات القديمة
          rm -rf lib
          
          # نسخ كودك
          cp -r ../lib .
          
          # نسخ pubspec.yaml المعدل (الخفيف)
          cp ../pubspec.yaml .
          
          # تثبيت التبعيات
          flutter pub get
          
          cd ..

      - name: 🏗️ Build APK (release)
        run: |
          cd fresh_app
          flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: fresh_app/build/app/outputs/flutter-apk/*.apk
