name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🏗️ Create fresh Flutter project
        run: |
          mkdir fresh_app
          cd fresh_app
          flutter create --org com.aec --project-name aec_community .
          cd ..

      - name: 🔄 Replace with your custom code and assets
        run: |
          rm -rf fresh_app/lib
          rm -rf fresh_app/assets
          cp -r lib fresh_app/
          cp -r assets fresh_app/ 2>/dev/null || true
          cp pubspec.yaml fresh_app/ 2>/dev/null || true

      - name: 📦 Install dependencies
        run: |
          cd fresh_app
          flutter pub get

      - name: 🔧 Fix Kotlin version to 1.9.0 + Gradle 8.0 (using perl for reliability)
        run: |
          cd fresh_app/android
          
          # 1. تحديث إصدار Kotlin في build.gradle (استخدام perl للتأكد)
          perl -pi -e 's/ext\.kotlin_version\s*=\s*.*/ext.kotlin_version = "1.9.0"/' build.gradle
          
          # 2. تحديث Gradle wrapper إلى الإصدار 8.0 (متوافق)
          cd gradle/wrapper
          perl -pi -e 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.0-all.zip|' gradle-wrapper.properties
          cd ../..
          
          # 3. إضافة resolutionStrategy لتوحيد إصدار Kotlin (للتأكد من عدم التعارض)
          echo '' >> build.gradle
          echo 'subprojects {' >> build.gradle
          echo '    configurations.all {' >> build.gradle
          echo '        resolutionStrategy {' >> build.gradle
          echo '            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"' >> build.gradle
          echo '            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"' >> build.gradle
          echo '        }' >> build.gradle
          echo '    }' >> build.gradle
          echo '}' >> build.gradle
          
          echo "✅ Kotlin version = 1.9.0, Gradle = 8.0"

      - name: 🛠️ Fix Gradle wrapper permissions
        run: |
          cd fresh_app/android
          chmod +x gradlew

      - name: 🏗️ Build APK (release)
        run: |
          cd fresh_app
          flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: fresh_app/build/app/outputs/flutter-apk/*.apk
