name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🏗️ Create fresh project with exact config
        run: |
          # إنشاء مشروع جديد
          flutter create --org com.aec --project-name aec_community fresh_app
          
          # الانتقال إلى المشروع
          cd fresh_app
          
          # حذف الملفات القديمة
          rm -rf lib
          
          # نسخ كودك
          cp -r ../lib .
          
          # نسخ pubspec.yaml المعدل
          cat > pubspec.yaml << 'EOF'
          name: aec_community
          description: AEC Community App
          version: 1.0.0
          
          environment:
            sdk: ">=3.0.0 <4.0.0"
          
          dependencies:
            flutter:
              sdk: flutter
            flutter_animate: ^4.1.0
            flutter_secure_storage: ^9.0.0
            flutter_local_notifications: ^17.0.0
            timezone: ^0.9.0
            sqflite: ^2.3.0
            path_provider: ^2.1.0
            path: ^1.9.0
            crypto: ^3.0.3
            device_info_plus: ^9.1.0
            share_plus: ^7.2.1
            intl: ^0.18.0
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
          EOF
          
          # تثبيت التبعيات
          flutter pub get
          
          cd ..

      - name: 🔧 Fix Kotlin/Gradle versions
        run: |
          cd fresh_app/android
          
          # تغيير إصدار Kotlin في build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
          
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # تغيير gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          chmod +x gradlew
          cd ../..

      - name: 🏗️ Build APK
        run: |
          cd fresh_app
          flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: fresh_app/build/app/outputs/flutter-apk/*.apk
