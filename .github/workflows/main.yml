name: Build AEC Community APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🏗️ Create fresh project with exact config
        run: |
          # إنشاء مشروع جديد
          flutter create --org com.aec --project-name aec_community fresh_app
          
          # الانتقال إلى المشروع
          cd fresh_app
          
          # حذف الملفات القديمة
          rm -rf lib
          
          # نسخ كودك (من المستودع)
          cp -r ../lib .
          
          # نسخ pubspec.yaml المعدل (من المستودع)
          cp ../pubspec.yaml .
          
          # تثبيت التبعيات
          flutter pub get
          
          cd ..

      - name: 🔧 Replace Gradle files with compatible versions
        run: |
          cd fresh_app/android
          
          # استبدال ملف build.gradle (project level)
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
          
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          # استبدال ملف gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # منح صلاحيات التنفيذ لـ gradlew
          chmod +x gradlew
          
          cd ../..

      - name: 🏗️ Build APK (release)
        run: |
          cd fresh_app
          flutter build apk --release --split-per-abi

      - name: 📤 Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: aec-apk-files
          path: fresh_app/build/app/outputs/flutter-apk/*.apk
